# Flatpak manifest for the single-file bundle attached to every GitHub release
# (solidcraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
# Adapted from PhotoCraft's (storytold/photocraft, Apache-2.0; see ATTRIBUTION.md).
#
# It repackages the release's own Linux tarball (solidcraft-<version>-linux-<arch>.tar.gz, built
# on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no network
# during the build, and the same binaries as the AppImage/deb/rpm. The binaries need glibc >= 2.35
# and load X11, Wayland, xkbcommon and Vulkan at runtime; the freedesktop runtime has all of
# them, and the GPU driver comes from its org.freedesktop.Platform.GL extension.
# TCI-CAD's own id: it never replaces or reads a SolidCraft or SolveCraft install
# (docs/compatibility.md).
id: com.tcicad.TciCad
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: solidcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu viewport (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend), so picked
  # files work anywhere without broad filesystem access. Documents is granted so files passed by
  # path (the command line, recent designs) work in the usual place.
  - --filesystem=xdg-documents
  # Deliberately not granted: network (the optional --control server listens on 127.0.0.1 in
  # the sandbox; `flatpak override --user --share=network com.tcicad.TciCad` exposes it to
  # host agents) and home/host filesystem access.
modules:
  - name: solidcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/solidcraft /app/bin/solidcraft
      - install -Dm755 bin/solidcraft-cli /app/bin/solidcraft-cli
      # The old CLI name, forwarding to solidcraft-cli (compatibility shim, docs/compatibility.md).
      - install -Dm755 bin/solvecraft-cli /app/bin/solvecraft-cli
      - install -Dm644 share/applications/com.tcicad.TciCad.desktop /app/share/applications/com.tcicad.TciCad.desktop
      - install -Dm644 share/mime/packages/com.tcicad.TciCad.xml /app/share/mime/packages/com.tcicad.TciCad.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/com.tcicad.TciCad.metainfo.xml /app/share/metainfo/com.tcicad.TciCad.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/solidcraft /app/share/doc/
    sources:
      - type: dir
        path: stage
